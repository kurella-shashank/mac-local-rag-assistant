[project]
name = "mac-local-rag-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kurella-shashank", email = "k.shashank2306@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.7",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
]

[project.scripts]
mac-local-rag-assistant = "mac_local_rag_assistant:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mac_local_rag"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "reportlab>=5.1.0",
]
